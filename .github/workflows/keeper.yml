# Drives round settlement.
#
# Vercel Cron is the obvious home for this, but the Hobby plan caps schedules
# at once per day — a once-a-minute entry in vercel.json is rejected and takes
# the whole deployment down with it. So vercel.json keeps a daily backstop that
# deploys on any plan, and the real cadence runs from here, where it is free.
#
# Five minutes is GitHub's floor, but "best-effort" turned out to mean roughly
# every four hours in practice — runs #24, #25 and #26 spanned eight. Against a
# two-hour randomness timeout that missed more rounds than it caught, and four
# consecutive rounds refunded because the draw never happened.
#
# This schedule is therefore a backstop, not the keeper. Point an external
# pinger at /api/keeper every minute or two with the same Bearer secret;
# anything that can hold a schedule will do. Until one is running, the on-chain
# randomness timeout has to be wide enough to survive GitHub's drift — see
# contracts/script/TuneRandomnessTimeout.s.sol.
name: keeper

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  advance-rounds:
    runs-on: ubuntu-latest
    steps:
      - name: Advance any round that is due
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          KEEPER_URL: ${{ vars.KEEPER_URL || 'https://www.robacha.fun/api/keeper' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set in repository secrets — nothing to do."
            exit 1
          fi
          code=$(curl -s -o response.json -w "%{http_code}" \
            --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$KEEPER_URL")
          echo "HTTP $code"
          # The body reports which rounds moved. It never contains the key.
          cat response.json
          echo ""
          if [ "$code" != "200" ]; then
            echo "Keeper call failed."
            exit 1
          fi
