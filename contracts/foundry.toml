[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"
via_ir = true

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  # CCIPReceiver pins its OZ import path to a version-suffixed alias.
  "@openzeppelin/contracts@5.3.0/=lib/openzeppelin-contracts/contracts/",
  "@chainlink/contracts-ccip/=lib/chainlink-ccip/",
  "@chainlink/contracts/=lib/chainlink/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 96
depth = 32
fail_on_revert = false

[profile.ci.fuzz]
runs = 2048
